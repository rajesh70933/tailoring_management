{% extends 'base.html' %}

{% block content %}

<style>
    body {
        background-color: #f4f6f9;
    }

    .topbar {
    background: white;
    padding: 15px 20px;
    border-radius: 10px;
    box-shadow: 0px 2px 10px rgba(0,0,0,0.05);
    
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;

    position: sticky;   /* ✅ important */
    top: 0;             /* ✅ stick to top */
    z-index: 1000;      /* ✅ stay above table */
}


    .card-box {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0px 2px 10px rgba(0,0,0,0.05);
    }

    .btn-custom {
        background: #2563eb;
        color: white;
        border-radius: 8px;
    }

    .btn-custom:hover {
        background: #1d4ed8;
    }
</style>

<!-- Topbar -->
<div class="topbar">
    <h3 class="mb-0"><b >CUSTOMER LIST</b></h3>

    <div>
        <a href="/add/" class="btn btn-custom">➕ Add Customer</a>
    </div>
</div>

<!-- Customer Table -->
<div class="card-box">
    <!--<h4 class="mb-3">Customer List</h4>-->

    <table class="table table-hover align-middle">
        <thead class="table-light">
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th class="text-center">Action</th>
            </tr>
        </thead>

        <tbody>
            {% for customer in customers %}
            <tr>
                <td>
                    <a href="/customer/{{ customer.id }}/"
                       class="fw-semibold text-decoration-none text-dark">
                        {{ customer.name }}
                    </a>
                </td>

                <td>{{ customer.phone }}</td>

                <td class="text-center">
                    <a href="/delete-customer/{{ customer.id }}/"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('Delete this customer?')">
                       🗑 Delete
                    </a>
                </td>
            </tr>

            {% empty %}
            <tr>
                <td colspan="3" class="text-center text-muted">
                    No customers available
                </td>
            </tr>
            {% endfor %}
        </tbody>

    </table>
</div>

{% endblock %}

<!DOCTYPE html>
<html>
<head>
    <title>Lakshmi Ladies Tailoring</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-color: linear-gradient(135deg, #667eea, #764ba2);
            --text-color: white;
            --card-bg: rgba(255,255,255,0.1);
        }

        body.light-mode {
            --bg-color: #f8fafc;
            --text-color: #111;
            --card-bg: white;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            transition: 0.3s;
        }

        /* 🔷 NAVBAR */
        .navbar-custom {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            backdrop-filter: blur(10px);
        }

        .toggle-btn {
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* 🔶 HERO */
        .hero {
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: bold;
        }

        .hero p {
            opacity: 0.8;
        }

        .btn-main {
            margin-top: 20px;
            border-radius: 30px;
            padding: 12px 30px;
        }

        /* 🔷 CARDS */
        .card-glass {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: 0.3s;
        }

        .card-glass:hover {
            transform: translateY(-10px) scale(1.03);
        }

        /* ✨ ANIMATION */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 🔻 FOOTER */
        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<!-- 🔷 NAVBAR -->
<div class="navbar-custom">
    <h4>✂️ Lakshmi</h4>

    <button onclick="toggleMode()" class="toggle-btn btn btn-light">
        🌙 Mode
    </button>
</div>

<!-- 🔶 HERO -->
<div class="hero fade-in">
    <h1>Lakshmi Designers</h1>
    <p>Manage your boutique like a pro</p>

    <a href="/dashboard/" class="btn btn-light btn-main">
        🚀 Get Started
    </a>
</div>

<!-- 🔷 FEATURES -->
<div class="container mt-4">
    <div class="row g-4">

        <div class="col-md-3 fade-in">
            <div class="card-glass">
                <h2>👥</h2>
                <h5>Customers</h5>
                <a href="/customers/" class="btn btn-outline-light btn-sm mt-2">Open</a>
            </div>
        </div>

        <div class="col-md-3 fade-in">
            <div class="card-glass">
                <h2>📦</h2>
                <h5>Orders</h5>
                <a href="/orders/" class="btn btn-outline-light btn-sm mt-2">Open</a>
            </div>
        </div>

        <div class="col-md-3 fade-in">
            <div class="card-glass">
                <h2>📊</h2>
                <h5>Dashboard</h5>
                <a href="/dashboard/" class="btn btn-outline-light btn-sm mt-2">Open</a>
            </div>
        </div>

        <div class="col-md-3 fade-in">
            <div class="card-glass">
                <h2>📜</h2>
                <h5>History</h5>
                <a href="/history/" class="btn btn-outline-light btn-sm mt-2">Open</a>
            </div>
        </div>

    </div>
</div>

<!-- 🔻 FOOTER -->
<div class="footer">
    © 2026 Lakshmi Ladies Tailoring 🚀
</div>

<!-- 🔥 DARK MODE SCRIPT -->
<script>
    function toggleMode() {
        document.body.classList.toggle("light-mode");
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Measurements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2>Measurements</h2>

<table class="table table-bordered">

<tr>
    <th>Dress</th>
    <th>Chest</th>
    <th>Waist</th>
    <th>Hip</th>
    <th>Shoulder</th>
    <th>Sleeve</th>
</tr>

{% for m in measurements %}

<tr>
    <td>{{ m.dress_type }}</td>
    <td>{{ m.chest }}</td>
    <td>{{ m.waist }}</td>
    <td>{{ m.hip }}</td>
    <td>{{ m.shoulder }}</td>
    <td>{{ m.sleeve_length }}</td>
    <td>
    <a href="/edit-measurement/{{ m.id }}/" class="btn btn-warning btn-sm">
        Edit
    </a>
    </td>

</tr>

{% endfor %}

</table>
<a href="/orders/" class="btn btn-secondary">Back</a>

</body>
</html>

<!DOCTYPE html>
<html>

<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="container mt-5">
    

<h2>Add Order</h2>

<form method="POST">

{% csrf_token %}

<div class="mb-3">
    <label>Customer</label>
    {{ form.customer }}
</div>

<div class="mb-3">
    <label>Dress Type</label>
    {{ form.dress_type }}
</div>

<div class="mb-3">
    <label>Price</label>
    {{ form.price }}
</div>

<h4 class="mt-4">Measurements</h4>

<div class="mb-3">
    <label>Chest</label>
    <input type="number" name="chest" class="form-control">
</div>

<div class="mb-3">
    <label>Waist</label>
    <input type="number" name="waist" class="form-control">
</div>

<div class="mb-3">
    <label>Hip</label>
    <input type="number" name="hip" class="form-control">
</div>

<div class="mb-3">
    <label>Shoulder</label>
    <input type="number" name="shoulder" class="form-control">
</div>

<div class="mb-3">
    <label>Sleeve Length</label>
    <input type="number" name="sleeve_length" class="form-control">
</div>



<div class="mb-3">
    <label>Order Date</label>
    <div class="d-flex">
        {{ form.order_date }}
        <button type="button" class="btn btn-outline-primary ms-2"
            onclick="setToday('order_date')">
            Today
        </button>
    </div>
</div>

<div class="mb-3">
    <label>Delivery Date</label>
    <div class="d-flex">
        {{ form.delivery_date }}
        <button type="button" class="btn btn-outline-primary ms-2"
            onclick="setToday('delivery_date')">
            Today
        </button>
    </div>
</div>



<div class="mb-3">
    <label>Status</label>
    {{ form.status }}
</div>


<button type="submit" class="btn btn-success">
Save Order
</button>
<a href="/orders/" class="btn btn-secondary">Back</a>


</form>
<script>
function setToday(fieldName) {
    let today = new Date().toISOString().split('T')[0];

    let inputs = document.getElementsByName(fieldName);
    if (inputs.length > 0) {
        inputs[0].value = today;
    }
}
</script>


</body>

</html>

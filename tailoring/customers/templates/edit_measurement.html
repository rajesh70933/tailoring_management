<!DOCTYPE html>
<html>
<head>
    <title>Edit Measurement</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2>Edit Measurement</h2>

<form method="POST">

{% csrf_token %}

<div class="mb-3">
    <label>Chest</label>
    <input type="number" name="chest" value="{{ m.chest }}" class="form-control">
</div>

<div class="mb-3">
    <label>Waist</label>
    <input type="number" name="waist" value="{{ m.waist }}" class="form-control">
</div>

<div class="mb-3">
    <label>Hip</label>
    <input type="number" name="hip" value="{{ m.hip }}" class="form-control">
</div>

<div class="mb-3">
    <label>Shoulder</label>
    <input type="number" name="shoulder" value="{{ m.shoulder }}" class="form-control">
</div>

<div class="mb-3">
    <label>Sleeve Length</label>
    <input type="number" name="sleeve_length" value="{{ m.sleeve_length }}" class="form-control">
</div>

<button type="submit" class="btn btn-success">
    Update
</button>

<a href="/customer-measurements/{{ m.customer.id }}/" class="btn btn-secondary">
    Back
</a>

</form>

</body>
</html>

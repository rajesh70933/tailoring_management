<!DOCTYPE html>
<html>
<head>
    <title>Today's Deliveries</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2 class="mb-4">Today's Deliveries</h2>

<table class="table table-bordered">

<tr>
    <th>Customer</th>
    <th>Dress</th>
    <th>Price</th>
</tr>

{% for order in orders %}

<tr>
    <td>{{ order.customer.name }}</td>
    <td>{{ order.dress_type }}</td>
    <td>₹{{ order.price }}</td>
</tr>

{% empty %}

<tr>
    <td colspan="3">No deliveries today</td>
</tr>

{% endfor %}

</table>
<a href="/orders/" class="btn btn-secondary">Back</a>

</body>
</html>
